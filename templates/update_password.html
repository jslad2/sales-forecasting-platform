<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        form {
            display: inline-block;
            text-align: left;
            background: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            color: red;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Reset Your Password</h1>
    
    <!-- Show Flash Messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="message">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <!-- ✅ Hidden fields for the token & email -->
        <input type="hidden" name="token" value="{{ request.args.get('token') }}">
        <input type="hidden" name="email" value="{{ request.args.get('email') }}">

        <label for="password">New Password:</label>
        <input type="password" name="password" id="password" required minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}"
               title="Must contain at least one number, one uppercase letter, and at least 8 or more characters">

        <button type="submit">Update Password</button>
    </form>

    <p>Go back to <a href="{{ url_for('login') }}">Login</a></p>

</body>
</html>
