<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Forecasting</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-lg" style="max-width: 400px; width: 100%;">
            <h2 class="text-center">Login</h2>

            <!-- ✅ Flash Messages (Show All) -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger" role="alert">
                        <ul class="mb-0">
                            {% for message in messages %}
                                <li>{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
            {% endwith %}

            <!-- ✅ No action so JavaScript handles it -->
            <form id="login-form" novalidate>  
                <input type="hidden" name="prevent-autofill" value="true">  <!-- Prevents unwanted submissions -->

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <button type="submit" id="login-button" class="btn btn-primary w-100">Login</button>
            </form>            

            <div class="text-center mt-3">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
                <p><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <!-- ✅ Debug log to confirm JavaScript execution -->
    <script>
        console.log("✅ login.html loaded, now loading auth.js...");
    </script>

    <!-- ✅ Ensure JavaScript is loaded at the end -->
    <script src="/static/js/auth.js" defer></script> 
</body>
</html>
