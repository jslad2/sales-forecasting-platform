<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SynovaAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-page">

    <!-- Header -->
    <header>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('data_services') }}">Data Services</a>
            <a href="{{ url_for('pricing') }}">Pricing</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
        <div class="logo">SYNOVAAI</div>
    </header>

    <!-- Dashboard Welcome Section -->
    <section class="dashboard-container">
        <h2>Welcome, {{ user_email }}!</h2>
        <p>Your Subscription: <strong>{{ user_plan }}</strong></p>

        <!-- Links -->
        <div class="dashboard-links">
            <a href="{{ url_for('forecasting_tool') }}" class="dashboard-button">📊 Access Forecasting Tool</a>
            {% if user_plan == "free" %}
                <a href="{{ url_for('pricing') }}" class="dashboard-button">🚀 Upgrade to Premium</a>
            {% endif %}
            <a href="{{ url_for('support') }}" class="dashboard-button">📖 Help & Documentation</a>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2025 SynovaAI. All rights reserved.</p>
    </footer>

</body>
</html>
